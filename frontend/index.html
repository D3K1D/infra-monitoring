<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrastructure Monitoring</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <span class="title-bar-text">Infrastructure Monitoring</span>
        </div>

        <nav class="menu-bar">
            <a href="index.html" class="active">Dashboard</a>
            <a href="alerts.html">Alerts</a>
            <a href="thresholds.html">Thresholds</a>
            <a href="users.html" class="admin-only" hidden>Users</a>
            <span class="menu-session" id="session-info"></span>
        </nav>

        <div class="window-body">
            <section class="summary">
                <div class="card"><span class="card-value" id="count-total">&ndash;</span><span class="card-label">Total Nodes</span></div>
                <div class="card"><span class="card-value" id="count-online">&ndash;</span><span class="card-label">Online</span></div>
                <div class="card"><span class="card-value" id="count-warning">&ndash;</span><span class="card-label">Warning</span></div>
                <div class="card"><span class="card-value" id="count-offline">&ndash;</span><span class="card-label">Offline</span></div>
                <div class="card">
                    <span class="card-value" id="count-alerts">&ndash;</span>
                    <span class="card-label">Active Alerts</span>
                    <span class="card-detail" id="alert-breakdown"></span>
                </div>
                <div class="card"><span class="card-value" id="uptime">&ndash;</span><span class="card-label" id="uptime-label">Uptime (24 hours)</span></div>
            </section>

            <section class="controls">
                <input type="text" id="search" placeholder="Search by hostname or IP...">
                <select id="status-filter">
                    <option value="all">All statuses</option>
                    <option value="online">Online</option>
                    <option value="warning">Warning</option>
                    <option value="offline">Offline</option>
                </select>
                <label for="summary-window">Summary:</label>
                <select id="summary-window">
                    <option value="15">15 minutes</option>
                    <option value="60">1 hour</option>
                    <option value="360">6 hours</option>
                    <option value="1440" selected>24 hours</option>
                    <option value="10080">7 days</option>
                </select>
            </section>

            <div class="sunken-panel">
                <table class="nodes">
                    <thead>
                        <tr>
                            <th>Status</th>
                            <th>Disk Space</th>
                            <th>Hostname</th>
                            <th>IP Address</th>
                            <th>OS</th>
                            <th>Location</th>
                            <th>Last Seen</th>
                        </tr>
                    </thead>
                    <tbody id="node-rows">
                        <tr><td colspan="7" class="muted">Loading nodes...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="status-bar">
            <span class="status-cell" id="last-updated">Loading...</span>
            <span class="status-cell">Monitoring System v0.1</span>
        </div>
    </div>

    <script src="js/util.js"></script>
    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
